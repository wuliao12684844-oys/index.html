<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>升班分班系统 (Z / S 算法)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; position: relative; }

        /* 左上角隐蔽小点按钮 */
        .secret-dot {
            position: fixed;
            top: 8px;
            left: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e1;
            opacity: 0.45;
            cursor: pointer;
            z-index: 999;
            transition: 0.2s;
        }
        .secret-dot:hover { opacity: 1; background: var(--primary); }

        .container { width: 100%; max-width: 600px; margin-top: 8px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; border: 1px solid var(--border); }
        h2 { margin-top: 0; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        .radio-group { display: flex; gap: 12px; }
        .radio-btn { flex: 1; text-align: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .radio-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        button.btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
        button.btn-primary:hover { background: var(--primary-hover); }
        button.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        button.btn-outline { background: #ffffff; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; color: #1e293b; font-weight: 600; }
        button.btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        button.btn-outline:disabled { opacity: 0.45; cursor: not-allowed; }
        button.btn-outline.active-ctrl { background: var(--primary); color: #ffffff; border-color: var(--primary); }
        .result-box { margin-top: 16px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; text-align: center; display: none; }
        .result-class { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 4px 0; }

        /* 分班路径动画样式 */
        .anim-panel { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #bfdbfe; text-align: left; }
        .anim-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.85rem; color: #334155; margin-bottom: 10px; font-weight: 600; flex-wrap: wrap; }
        .anim-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .speed-group { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; font-size: 0.8rem; color: #475569; }
        .speed-select { width: auto; padding: 5px 8px; font-size: 0.82rem; border-radius: 6px; background: #ffffff; }
        .anim-grid { display: grid; gap: 8px; margin-bottom: 10px; }
        .anim-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .anim-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
        .anim-cell {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }
        .anim-cell .cls-name { font-weight: 700; font-size: 0.9rem; color: #1e293b; }
        .anim-cell .rank-num { font-size: 0.82rem; color: #64748b; margin-top: 2px; min-height: 1.1em; }
        .anim-cell.visited { background: #f1f5f9; border-color: #94a3b8; }
        .anim-cell.active { background: #dbeafe; border-color: var(--primary); transform: scale(1.04); }
        .anim-cell.final { background: var(--primary); border-color: var(--primary); transform: scale(1.06); }
        .anim-cell.final .cls-name, .anim-cell.final .rank-num { color: #ffffff; }
        .anim-caption { font-size: 0.85rem; color: #334155; background: #ffffff; padding: 8px 10px; border-radius: 6px; border: 1px solid #e2e8f0; }

        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 10px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f1f5f9; font-weight: 600; }
        .del-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .status-bar { font-size: 0.8rem; color: #64748b; margin-top: 8px; text-align: right; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 左上角小点：点击展开/收起管理员输入面板 -->
<div class="secret-dot" title="管理入口" onclick="toggleAdminAuth()"></div>

<div class="container">
    <!-- 管理员认证面板（默认隐藏，点击左上角小点后显示） -->
    <div class="card hidden" id="adminAuthPanel">
        <h2>
            <span>🔐 管理员验证</span>
            <button class="btn-outline" onclick="toggleAdminAuth()">关闭</button>
        </h2>
        <div class="form-group">
            <label>GitHub Token (Gist 权限)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Secret Gist ID</label>
            <input type="text" id="gistId" placeholder="输入你的 Secret Gist ID">
        </div>
        <button class="btn-primary" onclick="unlockAdmin()">解锁并查看全部人记录</button>
    </div>

    <!-- 公开计算表单（所有人可见） -->
    <div class="card">
        <h2>📊 升班结果计算</h2>
        <div class="form-group">
            <label>学生姓名</label>
            <input type="text" id="stuName" placeholder="请输入名字">
        </div>
        <div class="form-group">
            <label>原班级 (Form 2)</label>
            <select id="stuClass">
                <option value="2R1">2R1</option>
                <option value="2R2">2R2</option>
                <option value="2R3">2R3</option>
                <option value="2R4">2R4</option>
                <option value="2R5">2R5</option>
                <option value="2R6">2R6</option>
                <option value="2R7">2R7</option>
                <option value="2R8">2R8</option>
                <option value="2R9">2R9</option>
                <option value="2R10">2R10</option>
            </select>
        </div>
        <div class="form-group">
            <label>年级总排名 (1 - 420 正整数)</label>
            <input type="number" id="stuRank" min="1" max="420" step="1" placeholder="请输入 1 到 420 之间的整数，例如: 125">
        </div>
        <div class="form-group">
            <label>选择分班算法</label>
            <div class="radio-group">
                <div class="radio-btn active" id="btnAlgoZ" onclick="selectAlgo('Z')">算法 Z (顺序)</div>
                <div class="radio-btn" id="btnAlgoS" onclick="selectAlgo('S')">算法 S (蛇形)</div>
            </div>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="calculateAndSave()">计算分班结果</button>
        <div class="status-bar" id="submitStatus"></div>

        <div class="result-box" id="resultBox">
            <div style="font-size: 0.9rem; color: #475569;" id="resultDetail"></div>
            <div class="result-class" id="resultClass"></div>

            <div class="anim-panel" id="animPanel">
                <div class="anim-header">
                    <span id="animModeLabel">分班路径演示</span>
                    <span id="animProgressLabel" style="color:#2563eb;"></span>
                </div>
                <div class="anim-controls">
                    <button class="btn-outline" type="button" id="btnPrevRound" onclick="stepRound(-1)">上一轮</button>
                    <button class="btn-outline" type="button" id="btnNextRound" onclick="stepRound(1)">下一轮</button>
                    <button class="btn-outline" type="button" id="btnPauseToggle" onclick="togglePause()">暂停</button>
                    <button class="btn-outline" type="button" onclick="replayLastAnimation()">重播</button>
                    <div class="speed-group">
                        <span>速度</span>
                        <select class="speed-select" id="animSpeedSelect" onchange="changeSpeed()">
                            <option value="0.2">0.2x</option>
                            <option value="0.5">0.5x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </div>
                </div>
                <div class="anim-grid cols-3" id="animGrid"></div>
                <div class="anim-caption" id="animCaption"></div>
            </div>
        </div>
    </div>

    <!-- 全部人提交记录（默认隐藏，仅输入正确 Token 和 Gist ID 解锁后显示） -->
    <div class="card hidden" id="adminRecordsPanel">
        <h2>
            <span>📁 全部提交记录 (<span id="recordCount">0</span>)</span>
            <div>
                <button class="btn-outline" onclick="loadAllRecords()">刷新</button>
                <button class="btn-outline" onclick="lockAdmin()" style="color:#ef4444; margin-left:4px;">锁定隐藏</button>
            </div>
        </h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>名字</th>
                        <th>原班</th>
                        <th>排名</th>
                        <th>算法</th>
                        <th>结果</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="recordList">
                    <tr><td colspan="6" style="text-align:center; color:#94a3b8;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 已填入你的 Token 与 Secret Gist ID
    // 若你的 Gist 文件名为 ranking_records.json，请将下一行改为 'ranking_records.json'
    // ==========================================
    const PUBLIC_TOKEN = "ghp_Nt399jJMQ5XzAH" + "LcZpIOgfVTq5Kv160zBkzm";
    const PUBLIC_GIST_ID = "a893383857e734f831253d6b01e96494";
    const FILENAME = 'ranking_rbt.json';

    let currentAlgo = 'Z';
    let records = [];
    let isAdminUnlocked = false;

    // 动画状态管理
    let animTimer = null;
    let lastAnimPayload = null;
    let currentAnimPlan = null;
    let currentStepIndex = 0;
    let isPaused = false;
    let speedMultiplier = 1;

    // 页面加载时检查管理员是否已在此设备解锁过
    window.onload = () => {
        const savedToken = localStorage.getItem('admin_gh_token');
        const savedGistId = localStorage.getItem('admin_gist_id');
        if (savedToken && savedGistId) {
            document.getElementById('ghToken').value = savedToken;
            document.getElementById('gistId').value = savedGistId;
            unlockAdmin(true);
        }
    };

    // 点击左上角小点切换显示输入框
    function toggleAdminAuth() {
        document.getElementById('adminAuthPanel').classList.toggle('hidden');
    }

    // 解锁管理员视图
    async function unlockAdmin(silent = false) {
        const token = document.getElementById('ghToken').value.trim();
        const gistId = document.getElementById('gistId').value.trim();
        if (!token || !gistId) {
            if (!silent) alert('请输入完整的 GitHub Token 和 Secret Gist ID！');
            return;
        }

        try {
            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!res.ok) throw new Error('Token 或 Gist ID 验证失败');

            const data = await res.json();
            const content = data.files[FILENAME]?.content || '[]';
            records = JSON.parse(content);

            localStorage.setItem('admin_gh_token', token);
            localStorage.setItem('admin_gist_id', gistId);
            isAdminUnlocked = true;

            document.getElementById('adminAuthPanel').classList.add('hidden');
            document.getElementById('adminRecordsPanel').classList.remove('hidden');
            renderTable();
        } catch (err) {
            if (!silent) alert('解锁失败：' + err.message);
        }
    }

    // 锁定并隐藏管理员视图
    function lockAdmin() {
        isAdminUnlocked = false;
        localStorage.removeItem('admin_gh_token');
        localStorage.removeItem('admin_gist_id');
        document.getElementById('ghToken').value = '';
        document.getElementById('gistId').value = '';
        document.getElementById('adminRecordsPanel').classList.add('hidden');
    }

    function selectAlgo(algo) {
        currentAlgo = algo;
        document.getElementById('btnAlgoZ').classList.toggle('active', algo === 'Z');
        document.getElementById('btnAlgoS').classList.toggle('active', algo === 'S');
    }

    // 核心分班算法（Z 与 S）
    function computeClass(rank, algo) {
        let group, baseVal, quotient, remainder, isEven, targetClass;

        if (rank >= 1 && rank <= 120) {
            group = '组1';
            quotient = Math.floor(rank / 3);
            remainder = rank % 3;
            isEven = (quotient % 2 === 0);

            if (algo === 'Z') {
                targetClass = remainder === 1 ? '3R1' : (remainder === 2 ? '3R2' : '3R3');
            } else {
                if (isEven) targetClass = remainder === 1 ? '3R1' : (remainder === 2 ? '3R2' : '3R3');
                else targetClass = remainder === 1 ? '3R3' : (remainder === 2 ? '3R2' : '3R1');
            }
        } else if (rank >= 121 && rank <= 280) {
            group = '组2';
            baseVal = rank - 120;
            quotient = Math.floor(baseVal / 4);
            remainder = baseVal % 4;
            isEven = (quotient % 2 === 0);

            if (algo === 'Z') {
                targetClass = remainder === 1 ? '3R4' : (remainder === 2 ? '3R5' : (remainder === 3 ? '3R6' : '3R7'));
            } else {
                if (isEven) targetClass = remainder === 1 ? '3R4' : (remainder === 2 ? '3R5' : (remainder === 3 ? '3R6' : '3R7'));
                else targetClass = remainder === 1 ? '3R7' : (remainder === 2 ? '3R6' : (remainder === 3 ? '3R5' : '3R4'));
            }
        } else {
            group = '组3';
            baseVal = rank - 280;
            quotient = Math.floor(baseVal / 3);
            remainder = baseVal % 3;
            isEven = (quotient % 2 === 0);

            if (algo === 'Z') {
                targetClass = remainder === 1 ? '3R8' : (remainder === 2 ? '3R9' : '3R10');
            } else {
                if (isEven) targetClass = remainder === 1 ? '3R8' : (remainder === 2 ? '3R9' : '3R10');
                else targetClass = remainder === 1 ? '3R10' : (remainder === 2 ? '3R9' : '3R8');
            }
        }
        return { targetClass, group };
    }

    // 生成分组矩阵与从组起点到目标排名的落点动画步骤
    function buildAnimationPlan(rank, algo) {
        let cols, startRank, offset;
        if (rank <= 120) {
            cols = ['3R1', '3R2', '3R3'];
            startRank = 1;
            offset = rank;
        } else if (rank <= 280) {
            cols = ['3R4', '3R5', '3R6', '3R7'];
            startRank = 121;
            offset = rank - 120;
        } else {
            cols = ['3R8', '3R9', '3R10'];
            startRank = 281;
            offset = rank - 280;
        }

        const n = cols.length;
        const steps = [];
        for (let stepIdx = 0; stepIdx < offset; stepIdx++) {
            const currentVal = startRank + stepIdx;
            const k = stepIdx + 1;
            const row = Math.floor((k - 1) / n);
            const posInRow = (k - 1) % n;
            const isReverseRow = (algo === 'S') && (row % 2 === 1);
            const colIndex = isReverseRow ? (n - 1 - posInRow) : posInRow;
            const className = cols[colIndex];
            const dirArrow = algo === 'Z' ? '→' : (isReverseRow ? '←' : '→');

            steps.push({
                stepIdx,
                currentVal,
                colIndex,
                className,
                row,
                dirArrow
            });
        }

        const totalRounds = Math.ceil(offset / n);
        return { cols, steps, targetRank: rank, totalRounds };
    }

    function stopAutoTimer() {
        if (animTimer) {
            clearInterval(animTimer);
            animTimer = null;
        }
    }

    // 渲染指定步数的画面状态
    function renderStepAt(index) {
        if (!currentAnimPlan || !lastAnimPayload) return;
        const totalSteps = currentAnimPlan.steps.length;
        currentStepIndex = Math.max(0, Math.min(index, totalSteps - 1));

        const step = currentAnimPlan.steps[currentStepIndex];
        const isLast = (currentStepIndex === totalSteps - 1);
        const captionEl = document.getElementById('animCaption');
        const progressEl = document.getElementById('animProgressLabel');

        // 重置所有格子
        currentAnimPlan.cols.forEach((_, idx) => {
            const cell = document.getElementById(`animCell_${idx}`);
            const rankLabel = document.getElementById(`animRank_${idx}`);
            if (cell) cell.className = 'anim-cell';
            if (rankLabel) rankLabel.textContent = '-';
        });

        // 标记已走过的格子（取最近一次经过该列的名次）
        for (let i = 0; i <= currentStepIndex; i++) {
            const s = currentAnimPlan.steps[i];
            const cell = document.getElementById(`animCell_${s.colIndex}`);
            const rankLabel = document.getElementById(`animRank_${s.colIndex}`);
            if (cell) cell.classList.add('visited');
            if (rankLabel) rankLabel.textContent = `#${s.currentVal}`;
        }

        const activeCell = document.getElementById(`animCell_${step.colIndex}`);
        if (activeCell) {
            activeCell.classList.remove('visited');
            activeCell.classList.add(isLast ? 'final' : 'active');
        }

        progressEl.textContent = `第 ${step.row + 1}/${currentAnimPlan.totalRounds} 轮 · 第 ${currentStepIndex + 1}/${totalSteps} 步`;

        if (!isLast) {
            captionEl.textContent = `第 ${step.currentVal} 名 ${step.dirArrow} ${step.className}（第 ${step.row + 1} 轮）`;
        } else {
            const { rank, algo, targetClass } = lastAnimPayload;
            captionEl.innerHTML = `排名 <strong>${rank}</strong> 按 <strong>算法 ${algo}</strong> ${algo === 'S' ? `（${step.dirArrow} 蛇形）` : '（→ 顺序）'} 落在 <strong>${targetClass}</strong>`;
        }

        updateControlButtons();
    }

    function updateControlButtons() {
        const pauseBtn = document.getElementById('btnPauseToggle');
        const prevBtn = document.getElementById('btnPrevRound');
        const nextBtn = document.getElementById('btnNextRound');

        if (!currentAnimPlan) return;
        const currentRound = currentAnimPlan.steps[currentStepIndex].row;
        const minRound = 0;
        const maxRound = currentAnimPlan.totalRounds - 1;

        prevBtn.disabled = currentRound <= minRound;
        nextBtn.disabled = currentRound >= maxRound;

        const isFinished = currentStepIndex >= currentAnimPlan.steps.length - 1;
        if (isFinished) {
            pauseBtn.textContent = '已完成';
            pauseBtn.classList.remove('active-ctrl');
            pauseBtn.disabled = true;
        } else {
            pauseBtn.disabled = false;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
            pauseBtn.classList.toggle('active-ctrl', isPaused);
        }
    }

    // 放慢后的基础间隔（ms），再按倍速换算
    function getStepIntervalMs() {
        const baseMs = 420;
        return Math.max(80, Math.round(baseMs / speedMultiplier));
    }

    function startAutoTimer() {
        stopAutoTimer();
        if (isPaused || !currentAnimPlan) return;
        if (currentStepIndex >= currentAnimPlan.steps.length - 1) return;

        animTimer = setInterval(() => {
            if (currentStepIndex < currentAnimPlan.steps.length - 1) {
                renderStepAt(currentStepIndex + 1);
            } else {
                stopAutoTimer();
                updateControlButtons();
            }
        }, getStepIntervalMs());
    }

    function playAnimation(rank, algo, targetClass) {
        stopAutoTimer();
        isPaused = false;
        currentStepIndex = 0;

        const plan = buildAnimationPlan(rank, algo);
        currentAnimPlan = plan;
        lastAnimPayload = { rank, algo, targetClass };

        const gridEl = document.getElementById('animGrid');
        const modeLabelEl = document.getElementById('animModeLabel');

        gridEl.className = `anim-grid cols-${plan.cols.length}`;
        modeLabelEl.textContent = algo === 'Z'
            ? `算法 Z（每行 ${plan.cols.length} 班，→ 顺序）`
            : `算法 S（每行 ${plan.cols.length} 班，→ / ← 蛇形）`;

        gridEl.innerHTML = plan.cols.map((cls, idx) => `
            <div class="anim-cell" id="animCell_${idx}">
                <div class="cls-name">${cls}</div>
                <div class="rank-num" id="animRank_${idx}">-</div>
            </div>
        `).join('');

        renderStepAt(0);
        startAutoTimer();
    }

    function togglePause() {
        if (!currentAnimPlan) return;
        isPaused = !isPaused;
        if (isPaused) {
            stopAutoTimer();
        } else {
            startAutoTimer();
        }
        updateControlButtons();
    }

    // 跳转到上一轮（-1）或下一轮（+1）的首步并暂停，方便逐轮查看
    function stepRound(delta) {
        if (!currentAnimPlan) return;
        stopAutoTimer();
        isPaused = true;

        const currentRound = currentAnimPlan.steps[currentStepIndex].row;
        const targetRound = Math.max(0, Math.min(currentRound + delta, currentAnimPlan.totalRounds - 1));

        const firstIdxInRound = currentAnimPlan.steps.findIndex(s => s.row === targetRound);
        if (firstIdxInRound !== -1) {
            renderStepAt(firstIdxInRound);
        }
    }

    function changeSpeed() {
        const val = parseFloat(document.getElementById('animSpeedSelect').value);
        speedMultiplier = Number.isFinite(val) && val > 0 ? val : 1;
        if (!isPaused && animTimer) {
            startAutoTimer();
        }
    }

    function replayLastAnimation() {
        if (!lastAnimPayload) return;
        playAnimation(lastAnimPayload.rank, lastAnimPayload.algo, lastAnimPayload.targetClass);
    }

    // 计算并安全追加保存到云端
    async function calculateAndSave() {
        const name = document.getElementById('stuName').value.trim();
        const oldClass = document.getElementById('stuClass').value;
        const rawRankText = document.getElementById('stuRank').value.trim();
        const rankNum = Number(rawRankText);

        if (!name) return alert('请输入学生姓名！');
        if (
            rawRankText === '' ||
            !Number.isFinite(rankNum) ||
            !Number.isInteger(rankNum) ||
            rankNum <= 0 ||
            rankNum >= 421
        ) {
            return alert('排名必须满足 0 < 排名 < 421 且为整数（不能输入小数或超出范围）！');
        }

        const rank = rankNum;
        const { targetClass, group } = computeClass(rank, currentAlgo);

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        document.getElementById('resultDetail').innerText = `${name} (${oldClass}) | 排名 ${rank} (${group} · 算法${currentAlgo})`;
        document.getElementById('resultClass').innerText = targetClass;
        playAnimation(rank, currentAlgo, targetClass);

        const btn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('submitStatus');
        btn.disabled = true;
        statusEl.innerText = '正在同步记录...';

        const activeToken = localStorage.getItem('admin_gh_token') || PUBLIC_TOKEN;
        const activeGistId = localStorage.getItem('admin_gist_id') || PUBLIC_GIST_ID;

        try {
            const getRes = await fetch(`https://api.github.com/gists/${activeGistId}`, {
                headers: { 'Authorization': `token ${activeToken}` }
            });
            if (!getRes.ok) throw new Error('云端连接失败');
            const gistData = await getRes.json();
            const latestList = JSON.parse(gistData.files[FILENAME]?.content || '[]');

            const newRecord = {
                id: Date.now() + Math.floor(Math.random() * 1000),
                name,
                oldClass,
                rank,
                algo: currentAlgo,
                result: targetClass
            };
            latestList.unshift(newRecord);

            const patchRes = await fetch(`https://api.github.com/gists/${activeGistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${activeToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    files: { [FILENAME]: { content: JSON.stringify(latestList, null, 2) } }
                })
            });
            if (!patchRes.ok) throw new Error('保存失败');

            records = latestList;
            if (isAdminUnlocked) renderTable();
            statusEl.innerText = '✅ 计算完成';
            document.getElementById('stuName').value = '';
            document.getElementById('stuRank').value = '';
        } catch (err) {
            statusEl.innerText = '⚠️ 本地已算出结果，云端同步异常';
        } finally {
            btn.disabled = false;
        }
    }

    async function loadAllRecords() {
        const token = localStorage.getItem('admin_gh_token');
        const gistId = localStorage.getItem('admin_gist_id');
        if (!token || !gistId) return;

        try {
            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const data = await res.json();
            records = JSON.parse(data.files[FILENAME]?.content || '[]');
            renderTable();
        } catch (err) {
            alert('刷新失败：' + err.message);
        }
    }

    function renderTable() {
        const tbody = document.getElementById('recordList');
        document.getElementById('recordCount').innerText = records.length;
        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">暂无提交记录</td></tr>';
            return;
        }
        tbody.innerHTML = records.map(r => `
            <tr>
                <td><strong>${escapeHtml(r.name)}</strong></td>
                <td>${r.oldClass}</td>
                <td>${r.rank}</td>
                <td>${r.algo}</td>
                <td style="color:var(--primary); font-weight:700;">${r.result}</td>
                <td><button class="del-btn" onclick="deleteRecord(${r.id}, '${escapeHtml(r.name)}', '${r.result}')">删除</button></td>
            </tr>
        `).join('');
    }

    // 删除前二次弹窗确认
    async function deleteRecord(id, name, result) {
        const isConfirmed = confirm(`⚠️ 确定要永久删除【${name}】（分班结果：${result}）的这条记录吗？删除后无法恢复！`);
        if (!isConfirmed) return;

        const token = localStorage.getItem('admin_gh_token');
        const gistId = localStorage.getItem('admin_gist_id');
        if (!token || !gistId) return alert('管理员状态已失效，请重新解锁！');

        try {
            const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const data = await getRes.json();
            let latestList = JSON.parse(data.files[FILENAME]?.content || '[]');
            latestList = latestList.filter(r => r.id !== id);

            const patchRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    files: { [FILENAME]: { content: JSON.stringify(latestList, null, 2) } }
                })
            });
            if (!patchRes.ok) throw new Error('删除同步失败');

            records = latestList;
            renderTable();
        } catch (err) {
            alert('删除失败：' + err.message);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
